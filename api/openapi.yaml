openapi: 3.0.3
info:
  title: Aegis SRE Control Plane API
  version: 1.0.0
  description: Stable product API. Provider identifiers and credentials are never part of this contract.
servers:
  - url: /api/v1
paths:
  /capabilities:
    get:
      operationId: listCapabilities
      responses:
        '200':
          description: Runtime capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityList'
        default:
          $ref: '#/components/responses/Problem'
  /sessions:
    get:
      operationId: listSessions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SessionStatusFilter'
      responses:
        '200':
          description: Sessions visible to the current actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Created session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
  /sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    get:
      operationId: getSession
      responses:
        '200':
          description: Session aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteSession
      responses:
        '204':
          description: Session deleted
        default:
          $ref: '#/components/responses/Problem'
  /sessions/{session_id}/turns:stream:
    parameters:
      - $ref: '#/components/parameters/SessionID'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: startTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTurnRequest'
      responses:
        '200':
          description: Server-sent events conforming to api/events.schema.json
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /sessions/{session_id}/canvas:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    get:
      operationId: getSessionCanvas
      responses:
        '200':
          description: Persisted Canvas projection and query-backed chart definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasProjection'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateSessionCanvas
      parameters:
        - $ref: '#/components/parameters/CanvasRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCanvasRequest'
      responses:
        '200':
          description: Updated Canvas projection
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasProjection'
        default:
          $ref: '#/components/responses/Problem'
  /sessions/{session_id}/turns/{turn_id}:cancel:
    parameters:
      - $ref: '#/components/parameters/SessionID'
      - $ref: '#/components/parameters/TurnID'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: cancelTurn
      responses:
        '204':
          description: Turn cancellation requested
        default:
          $ref: '#/components/responses/Problem'
  /sessions/{session_id}/approvals/{approval_id}:resolve:
    parameters:
      - $ref: '#/components/parameters/SessionID'
      - $ref: '#/components/parameters/ApprovalID'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: resolveAgentApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: Server-sent continuation events
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /services:
    get:
      operationId: listServices
      parameters:
        - $ref: '#/components/parameters/FolderUID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Service entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        default:
          $ref: '#/components/responses/Problem'
  /knowledge-bases:
    get:
      operationId: listKnowledgeBases
      parameters:
        - $ref: '#/components/parameters/FolderUID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Knowledge bases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBasePage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createKnowledgeBase
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeBaseRequest'
      responses:
        '201':
          description: Created knowledge base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        default:
          $ref: '#/components/responses/Problem'
  /knowledge-bases/{knowledge_base_id}:
    parameters:
      - $ref: '#/components/parameters/KnowledgeBaseID'
    get:
      operationId: getKnowledgeBase
      responses:
        '200':
          description: Knowledge base visible in the trusted folder scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateKnowledgeBase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeBaseRequest'
      responses:
        '200':
          description: Updated knowledge base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteKnowledgeBase
      responses:
        '204':
          description: Knowledge base deleted
        default:
          $ref: '#/components/responses/Problem'
  /knowledge-bases/{knowledge_base_id}/documents:
    parameters:
      - $ref: '#/components/parameters/KnowledgeBaseID'
    get:
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createDocument
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '202':
          description: Document accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Problem'
  /knowledge-bases/{knowledge_base_id}/documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/KnowledgeBaseID'
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: getDocument
      responses:
        '200':
          description: Document and current parsing state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
      responses:
        '200':
          description: Updated document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteDocument
      responses:
        '204':
          description: Document deleted
        default:
          $ref: '#/components/responses/Problem'
  /knowledge-bases/{knowledge_base_id}/documents/{document_id}:index:
    parameters:
      - $ref: '#/components/parameters/KnowledgeBaseID'
      - $ref: '#/components/parameters/DocumentID'
    post:
      operationId: startDocumentIndexing
      responses:
        '202':
          description: Parsing accepted
        default:
          $ref: '#/components/responses/Problem'
  /knowledge-bases/{knowledge_base_id}/documents/{document_id}:stop:
    parameters:
      - $ref: '#/components/parameters/KnowledgeBaseID'
      - $ref: '#/components/parameters/DocumentID'
    post:
      operationId: stopDocumentIndexing
      responses:
        '202':
          description: Stop accepted
        default:
          $ref: '#/components/responses/Problem'
  /knowledge-bases/{knowledge_base_id}/documents/{document_id}/chunks:
    parameters:
      - $ref: '#/components/parameters/KnowledgeBaseID'
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: listDocumentChunks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Parsed chunks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeChunkPage'
        default:
          $ref: '#/components/responses/Problem'
  /knowledge-bases/{knowledge_base_id}/documents/{document_id}/content:
    parameters:
      - $ref: '#/components/parameters/KnowledgeBaseID'
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: downloadDocumentContent
      responses:
        '200':
          description: Original document content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
  /knowledge:search:
    post:
      operationId: searchKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSearchRequest'
      responses:
        '200':
          description: Ranked passages with stable citations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSearchResponse'
        default:
          $ref: '#/components/responses/Problem'
  /playbooks:
    get:
      operationId: listPlaybooks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Playbook references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybookPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPlaybook
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        '201':
          description: Created playbook reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playbook'
        default:
          $ref: '#/components/responses/Problem'
  /playbooks/validate:
    post:
      operationId: validateNewPlaybook
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        '200':
          description: Validation result for an unsaved native Dagu YAML document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        default:
          $ref: '#/components/responses/Problem'
  /playbooks/{playbook_id}/validate:
    parameters:
      - $ref: '#/components/parameters/PlaybookID'
    post:
      operationId: validatePlaybook
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        default:
          $ref: '#/components/responses/Problem'
  /playbooks/{playbook_id}:
    parameters:
      - $ref: '#/components/parameters/PlaybookID'
    get:
      operationId: getPlaybook
      responses:
        '200':
          description: Playbook with its native Dagu YAML source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playbook'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updatePlaybook
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        '200':
          description: Updated playbook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playbook'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePlaybook
      responses:
        '204':
          description: Playbook deleted
        default:
          $ref: '#/components/responses/Problem'
  /playbooks/{playbook_id}/runs:
    parameters:
      - $ref: '#/components/parameters/PlaybookID'
    get:
      operationId: listPlaybookRuns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Playbook runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybookRunPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: startPlaybookRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPlaybookRunRequest'
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybookRun'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunID'
    get:
      operationId: getPlaybookRun
      responses:
        '200':
          description: Run summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybookRun'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run_id}:cancel:
    parameters:
      - $ref: '#/components/parameters/RunID'
    post:
      operationId: cancelPlaybookRun
      responses:
        '204':
          description: Run cancelled
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run_id}:retry:
    parameters:
      - $ref: '#/components/parameters/RunID'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: retryPlaybookRun
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybookRun'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run_id}/human-tasks/{step_id}:complete:
    parameters:
      - $ref: '#/components/parameters/RunID'
      - $ref: '#/components/parameters/StepID'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: completePlaybookHumanTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: Human task completed
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run_id}/approvals/{step_id}:resolve:
    parameters:
      - $ref: '#/components/parameters/RunID'
      - $ref: '#/components/parameters/StepID'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: resolvePlaybookApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybookApprovalDecision'
      responses:
        '204':
          description: Approval resolved
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run_id}/artifacts:
    parameters:
      - $ref: '#/components/parameters/RunID'
    get:
      operationId: listPlaybookArtifacts
      responses:
        '200':
          description: Run artifacts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artifact'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run_id}/artifacts/preview:
    parameters:
      - $ref: '#/components/parameters/RunID'
      - $ref: '#/components/parameters/ArtifactPath'
    get:
      operationId: previewPlaybookArtifact
      responses:
        '200':
          description: Text artifact preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactPreview'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run_id}/artifacts/download:
    parameters:
      - $ref: '#/components/parameters/RunID'
      - $ref: '#/components/parameters/ArtifactPath'
    get:
      operationId: downloadPlaybookArtifact
      responses:
        '200':
          description: Artifact content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
  /runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunID'
    get:
      operationId: streamPlaybookRunEvents
      parameters:
        - name: after_sequence
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Server-sent run events conforming to api/events.schema.json
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    FolderUID:
      name: folder_uid
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BusinessID'
    TurnID:
      name: turn_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BusinessID'
    SessionStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [active, archived]
        default: active
    CanvasRevision:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"canvas:[0-9]+"$'
    ApprovalID:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BusinessID'
    KnowledgeBaseID:
      name: knowledge_base_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BusinessID'
    DocumentID:
      name: document_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BusinessID'
    PlaybookID:
      name: playbook_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BusinessID'
    RunID:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BusinessID'
    StepID:
      name: step_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z][A-Za-z0-9_-]{0,127}$'
    ArtifactPath:
      name: path
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 1024
  responses:
    Problem:
      description: Stable product error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    BusinessID:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,15}_[A-Za-z0-9_-]{8,64}$'
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id, trace_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum: [invalid_argument, unauthenticated, forbidden, not_found, conflict, capability_unavailable, provider_timeout, provider_unavailable, provider_result_unknown, internal]
        detail:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        retryable:
          type: boolean
          default: false
    Capability:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          enum: [agent, knowledge, playbook, canvas, grafana_read, grafana_write]
        status:
          type: string
          enum: [available, unavailable, degraded]
        reason:
          type: string
    CapabilityList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
    PageMetadata:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        next_cursor:
          type: string
        has_more:
          type: boolean
    Session:
      type: object
      additionalProperties: false
      required: [id, title, status, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/BusinessID'
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [active, archived, busy]
        folder_uid:
          type: string
          deprecated: true
          description: Request authorization context only; Agent Providers do not persist this value.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SessionPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Session'
    SessionDetail:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    QueryDefinition:
      type: object
      additionalProperties: false
      required: [id, version, datasource_uid, expression, range, created_at]
      properties:
        id:
          $ref: '#/components/schemas/BusinessID'
        version:
          type: integer
          format: int64
          minimum: 1
        datasource_uid:
          type: string
          minLength: 1
          maxLength: 512
        expression:
          type: string
          minLength: 1
          maxLength: 16384
        range:
          type: object
          additionalProperties: false
          required: [from, to, step_seconds]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            step_seconds:
              type: integer
              format: int64
              minimum: 1
        created_at:
          type: string
          format: date-time
    ChartDefinition:
      type: object
      additionalProperties: false
      required: [id, revision, query, title, description, visualization, viz_config, created_at, updated_at]
