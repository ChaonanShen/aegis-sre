name: aegis-sre

services:
  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./deploy/local/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      node-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    security_opt: [no-new-privileges:true]
    networks: [aegis-mcp]

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    read_only: true
    security_opt: [no-new-privileges:true]
    networks: [aegis-mcp]

  grafana:
    build:
      context: ./grafana-plugin/.config
      args:
        grafana_image: grafana-enterprise
        grafana_version: 13.0.2
        development: "false"
        anonymous_auth_enabled: "false"
    environment:
      AEGIS_CONTROL_PLANE_URL: http://control-plane:8080
      AEGIS_CONTROL_PLANE_TOKEN_FILE: /run/secrets/aegis-plugin-token
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED: "true"
      GF_FEATURE_TOGGLES_ENABLE: externalServiceAccounts
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_PATHS_CONFIG: /etc/grafana/aegis.ini
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-plugin-app
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana-plugin/config/grafana.ini:/etc/grafana/aegis.ini:ro
      - ./grafana-plugin/dist:/var/lib/grafana/plugins/grafana-plugin-app:ro
      - ./grafana-plugin/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      - ./deploy/local/secrets/plugin-token:/run/secrets/aegis-plugin-token:ro
      - ./deploy/local/secrets/grafana-admin-password:/run/secrets/grafana-admin-password:ro
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [aegis-app, aegis-mcp]

  control-plane:
    build:
      context: .
      dockerfile: deploy/control-plane/Dockerfile
    environment:
      AEGIS_AGENT_ID_KEY_FILE: /run/secrets/agent-id-key
      AEGIS_AGENT_ORG_ID: "1"
      AEGIS_AGENT_PROVIDER: opencode
      AEGIS_AGENT_TENANT_ID: default
      AEGIS_AGENT_URL: http://opencode:4096
      AEGIS_AGENT_USER_ID: grafana:default:admin
      AEGIS_CANVAS_DB_PATH: /var/lib/aegis/canvas/canvas.db
      AEGIS_CANVAS_ENABLED: "true"
      AEGIS_CANVAS_MCP_TOKEN_FILE: /run/secrets/canvas-mcp-token
      AEGIS_DAGU_BASIC_AUTH_PASSWORD_FILE: /run/secrets/dagu-basic-password
      AEGIS_DAGU_BASIC_AUTH_USERNAME: admin
      AEGIS_DAGU_URL: http://dagu:8080
      AEGIS_HTTP_ADDRESS: :8080
      AEGIS_OPENCODE_PASSWORD_FILE: /run/secrets/opencode-server-password
      AEGIS_OPENCODE_USERNAME: opencode
      AEGIS_PLAYBOOK_MCP_FOLDER_UIDS: "infra,payment"
      AEGIS_PLAYBOOK_MCP_TOKEN_FILE: /run/secrets/playbook-mcp-token
      # 本地环境是固定单 Actor；生产多用户在逐 Turn 委托落地前不得开启写工具。
      AEGIS_PLAYBOOK_MCP_WRITE_ENABLED: "true"
      AEGIS_PLUGIN_TOKEN_FILE: /run/secrets/aegis-plugin-token
    volumes:
      - ./deploy/local/secrets/agent-id-key:/run/secrets/agent-id-key:ro
      - ./deploy/local/secrets/dagu-basic-password:/run/secrets/dagu-basic-password:ro
      - ./deploy/local/secrets/opencode-server-password:/run/secrets/opencode-server-password:ro
      - ./deploy/local/secrets/playbook-mcp-token:/run/secrets/playbook-mcp-token:ro
      - ./deploy/local/secrets/plugin-token:/run/secrets/aegis-plugin-token:ro
      - ./deploy/local/secrets/canvas-mcp-token:/run/secrets/canvas-mcp-token:ro
      - control-plane-data:/var/lib/aegis/canvas
    depends_on:
      dagu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [aegis-app]

  opencode:
    build:
      context: ./deploy/agents/opencode
      args:
        OPENCODE_VERSION: 1.18.18
    environment:
      OPENCODE_DISABLE_AUTOUPDATE: "true"
    volumes:
      - opencode-data:/var/lib/opencode
      - ./deploy/local/secrets/deepseek-api-key:/run/secrets/deepseek-api-key:ro
      - ./deploy/local/secrets/grafana-mcp-caller-token:/run/secrets/grafana-mcp-caller-token:ro
      - ./deploy/local/secrets/playbook-mcp-token:/run/secrets/playbook-mcp-token:ro
      - ./deploy/local/secrets/canvas-mcp-token:/run/secrets/canvas-mcp-token:ro
      - ./deploy/local/secrets/opencode-server-password:/run/secrets/opencode-server-password:ro
    depends_on:
      grafana-mcp-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/opencode-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
      - /workspace:uid=1000,gid=1000,mode=0700
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [aegis-app, aegis-mcp]

  dagu:
    build:
      context: .
      dockerfile: deploy/dagu/Dockerfile
    environment:
      DAGU_AUTH_BASIC_PASSWORD_FILE: /run/secrets/dagu-basic-password
      DAGU_AUTH_BASIC_USERNAME: admin
      DAGU_AUTH_MODE: basic
      DAGU_COORDINATOR_ENABLED: "false"
      DAGU_HOME: /var/lib/dagu
      DAGU_HOST: 0.0.0.0
      DAGU_PORT: 8080
      DAGU_TZ: Asia/Shanghai
      MCP_CALL_CONFIG: /etc/aegis/mcp-servers.yaml
    command: ["dagu", "start-all"]
    ports:
      - "127.0.0.1:${DAGU_PORT:-18081}:8080"
    volumes:
      - dagu-data:/var/lib/dagu
      - ./deploy/local/mcp-servers.yaml:/etc/aegis/mcp-servers.yaml:ro
      - ./deploy/local/secrets/dagu-basic-password:/run/secrets/dagu-basic-password:ro
      - ./deploy/local/secrets/grafana-mcp-caller-token:/run/secrets/grafana-mcp-caller-token:ro
    depends_on:
      grafana-mcp-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dagu", "version"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [aegis-app, aegis-mcp]

  grafana-read:
    image: grafana/mcp-grafana:1.0.0@sha256:5efeafd01cd7e1aea9c4b0f03305951f2944db8f43e5ae290cce9578c977f241
    command:
      - --transport=streamable-http
      - --address=:8000
      - --endpoint-path=/mcp
      - --allowed-hosts=grafana-read:8000
      - --enabled-tools=search,datasource,prometheus,loki,alerting,dashboard,navigation,rendering
      - --disable-write
      - --disable-proxied
      - --max-loki-log-limit=100
      - --metrics
    volumes:
      - grafana-mcp-secrets:/run/secrets/aegis:ro
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /run/secrets/aegis/grafana-service-account-token
    depends_on:
      grafana-bootstrap:
        condition: service_completed_successfully
    read_only: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [aegis-mcp]

  grafana-bootstrap:
    build:
      context: .
      dockerfile: deploy/grafana-bootstrap/Dockerfile
    command:
      - --grafana-url=http://grafana:3000
      - --username=admin
      - --password-file=/run/secrets/grafana-admin-password
      - --output-file=/run/aegis/grafana-service-account-token
    volumes:
      - ./deploy/local/secrets/grafana-admin-password:/run/secrets/grafana-admin-password:ro
      - grafana-mcp-secrets:/run/aegis
    depends_on: [grafana]
    restart: "no"
    security_opt: [no-new-privileges:true]
    networks: [aegis-mcp]

  grafana-mcp-gateway:
    build:
      context: .
      dockerfile: deploy/mcp-gateway/Dockerfile
    command:
      - --address=:8080
      - --upstream=http://grafana-read:8000
      - --token-file=/run/secrets/grafana-mcp-caller-token
    volumes:
      - ./deploy/local/secrets/grafana-mcp-caller-token:/run/secrets/grafana-mcp-caller-token:ro
    depends_on: [grafana-read]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [aegis-mcp]

networks:
  aegis-app:
  aegis-mcp:
    internal: true

volumes:
  dagu-data:
  grafana-data:
  grafana-mcp-secrets:
  control-plane-data:
  opencode-data:
  prometheus-data:
