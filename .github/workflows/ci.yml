name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control Plane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Format
        run: test -z "$(gofmt -l cmd internal)"

      - name: Verify generated contracts
        run: make contracts-go-check

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  raglite-sidecar:
    name: RAGLite sidecar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test and lint locked Python runtime
        run: make raglite-sidecar-test

      - name: Build and smoke test runtime image
        run: make raglite-image-smoke

      - name: Verify deployment contract
        run: make raglite-config-check raglite-deploy-test

  dagu-contract:
    name: Dagu mcp.call contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Dagu contract
        run: make dagu-contract-test

  grafana-plugin:
    name: Grafana plugin frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grafana-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: grafana-plugin/.nvmrc
          cache: npm
          cache-dependency-path: grafana-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated contracts
        run: make -C .. contracts-ts-check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  grafana-plugin-backend:
    name: Grafana plugin backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grafana-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: grafana-plugin/go.mod
          cache-dependency-path: grafana-plugin/go.sum

      - name: Format
        run: test -z "$(gofmt -l pkg)"

      - name: Test
        run: go test ./pkg/...

      - name: Vet
        run: go vet ./pkg/...

      - name: Build all platforms
        run: go run github.com/magefile/mage@v1.17.2 -v buildAll
