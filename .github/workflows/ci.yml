name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control Plane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Format
        run: test -z "$(gofmt -l cmd internal)"

      - name: Verify generated contracts
        run: make contracts-go-check

      - name: Migrate PostgreSQL
        env:
          AEGIS_DATABASE_URL: postgres://aegis:aegis@localhost:5432/aegis?sslmode=disable
        run: make db-up

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/control-plane

  grafana-plugin:
    name: Grafana plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grafana-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: grafana-plugin/.nvmrc
          cache: npm
          cache-dependency-path: grafana-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated contracts
        run: make -C .. contracts-ts-check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build
