servers:
  grafana-read:
    url: http://grafana-read:8000/mcp
    bearer_token_file: /run/secrets/grafana_mcp_caller_token
    allowed_tools:
      - list_datasources
      - query_prometheus
      - query_loki_logs
      - list_alert_rules
      - search_dashboards
    connect_timeout: 5s
    handshake_timeout: 10s
    call_timeout: 30s
    total_timeout: 45s
    max_text_bytes: 262144
    max_structured_bytes: 524288
    max_binary_bytes: 8388608
