type: graph
description: Collect node exporter metrics through Grafana MCP and summarize them.

steps:
  - id: query_up
    action: mcp.call
    with:
      server: grafana-read
      tool: query_prometheus
      args:
        datasourceUid: prometheus
        expr: sum(up{job="node-exporter"})
        endTime: now
        queryType: instant

  - id: query_cpu_busy_percent
    action: mcp.call
    with:
      server: grafana-read
      tool: query_prometheus
      args:
        datasourceUid: prometheus
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])))
        endTime: now
        queryType: instant

  - id: query_memory_available_gib
    action: mcp.call
    with:
      server: grafana-read
      tool: query_prometheus
      args:
        datasourceUid: prometheus
        expr: node_memory_MemAvailable_bytes{job="node-exporter"} / 1024 / 1024 / 1024
        endTime: now
        queryType: instant

  - id: summarize
    depends: [query_up, query_cpu_busy_percent, query_memory_available_gib]
    action: template.render
    with:
      data:
        up: ${query_up.output.text}
        cpu_busy_percent: ${query_cpu_busy_percent.output.text}
        memory_available_gib: ${query_memory_available_gib.output.text}
      template: |
        # Node health summary

        ## Node exporter targets up

        `sum(up{job="node-exporter"})`
        <!-- result:up -->
        {{ .up }}
        <!-- /result:up -->

        ## CPU busy percent

        `100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])))`
        <!-- result:cpu -->
        {{ .cpu_busy_percent }}
        <!-- /result:cpu -->

        ## Available memory GiB

        `node_memory_MemAvailable_bytes{job="node-exporter"} / 1024 / 1024 / 1024`
        <!-- result:memory -->
        {{ .memory_available_gib }}
        <!-- /result:memory -->
    stdout:
      artifact: reports/node-health-summary.md
